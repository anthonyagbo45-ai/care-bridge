<section class="case-updates" data-case-updates data-url="{{ updates_url }}" data-revision="{{ updates_revision }}" aria-label="Case updates">
  <div class="updates-heading"><p data-update-message role="status" aria-live="polite">Checking for updates while this page is visible.</p><a class="button button-secondary button-small" href="{{ refresh_url }}" data-refresh-updates>Refresh</a></div>
  <p class="help-text" data-update-help>Updates never replace what you are typing. Alerts work while this page is visible; response times are not guaranteed.</p>
  <noscript><p class="help-text">Automatic updates need JavaScript. Use Refresh to check manually.</p></noscript>
</section>
